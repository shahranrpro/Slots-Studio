services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slots-studio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: slots-studio-worker
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - web
